name: Release Artifact

env:
  NODE_VERSION: 22.14
  RUNID_VERSION_SUFFIX: ${{ github.run_id }}.${{ github.run_attempt }}

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Use Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          always-auth: true

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install yarn
        run: npm install --global yarn

      - name: Install dependencies
        run: yarn install

      - name: Check min-release-age (7 days)
        run: |
          node << 'SCRIPT'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const MIN_AGE_DAYS = 7;
          const MIN_AGE_MS = MIN_AGE_DAYS * 24 * 60 * 60 * 1000;
          const now = Date.now();
          const violations = [];
          const deps = { ...pkg.dependencies, ...pkg.devDependencies };

          for (const name of Object.keys(deps)) {
            try {
              const modPkg = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8'));
              const version = modPkg.version;
              const timeJson = execSync(`npm view "${name}" time --json 2>/dev/null`, { encoding: 'utf8' });
              const times = JSON.parse(timeJson);
              if (!times[version]) continue;
              const publishDate = new Date(times[version]);
              const ageMs = now - publishDate.getTime();
              if (ageMs < MIN_AGE_MS) {
                const ageDays = (ageMs / (24 * 60 * 60 * 1000)).toFixed(1);
                violations.push(`${name}@${version} - published ${ageDays} days ago (${publishDate.toISOString()})`);
              }
            } catch (e) { /* skip private/unreachable packages */ }
          }

          if (violations.length > 0) {
            console.error('\n❌ min-release-age check FAILED\n');
            console.error(`The following packages were published less than ${MIN_AGE_DAYS} days ago:`);
            violations.forEach(v => console.error('  • ' + v));
            console.error('\nThis is blocked to protect against supply chain attacks.\n');
            process.exit(1);
          }
          console.log(`✅ All direct dependencies pass min-release-age check (${MIN_AGE_DAYS} days)`);
          SCRIPT

      - name: Build
        run: yarn run build-package

      - name: Cache workspace
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-${{ env.RUNID_VERSION_SUFFIX }}

      - name: Archive failure data
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-data
          path: |
            /home/runner/.npm/_logs

  publish_github:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Use Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
          always-auth: true

      - name: Fetch cached workspace
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-${{ env.RUNID_VERSION_SUFFIX }}

      - name: Publish to GitHub packages
        run: yarn publish --access=public
        working-directory: ./dist/ngx-ts-riskid
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive failure data
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-data
          path: |
            /home/runner/.npm/_logs

  publish_npmjs:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Use Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          always-auth: true

      - name: Fetch cached workspace
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-${{ env.RUNID_VERSION_SUFFIX }}

      - name: Publish to npmjs
        run: npm publish --access=public
        working-directory: ./dist/ngx-ts-riskid
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_UPLOAD_TOKEN }}

      - name: Archive failure data
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-data
          path: |
            /home/runner/.npm/_logs
